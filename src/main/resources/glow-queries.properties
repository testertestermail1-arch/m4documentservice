#Salesforce Queries
sfdc.account.lookup.query=SELECT PGA_Opt_In__c,ID,AccountNumber,Classification_Code__c FROM Account WHERE AccountNumber = ':accountNumber'
sfdc.factoryWarranty.lookup.query=select id, name, Warranty_Type__r.type__c, Term_Months__c, Term_Miles__c from Factory_Warranty_type__c where Factory_Warranty__r.Vehicle_Code__r.Vehicle_Code__c = ':vehicleCode' and Factory_Warranty__r.Model_Year__c = ':vehicleYear' and Warranty_Type__r.type__c in ('BSC','P/T')
sfdc.templateUrl.lookup.query=Select Form_Number__c, Coverage_Plan__c, Template_URL__c from Form_Master_Table__c where Name =':formNumber'
sfdc.signCordinate.lookup.query=SELECT Name,Signature_Type__c,X_Left_Cordinate__c,X_Right_Cordinate__c,Y_Bottom_Cordinate__c,Y_Top_Cordinate__c,Template_Name__r.Form_Number__c,Page_Number_To_Print_On__c FROM Signature_Configuration_Table__c WHERE Template_Name__r.Form_Number__c = ':formNumber' AND IsActive__c = ':IsActive'
sfdc.buyersGuide.template.query=select Id,Name,Body from Attachment where ParentId = ':buyersGuideId'